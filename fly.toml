app = 'metro-life-api'
primary_region = 'dfw'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  METRO_DATA = '/data/metro-life.json'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks.api]
  type = 'http'
  port = 8080
  path = '/api/version'
  interval = '30s'
  timeout = '5s'
  grace_period = '45s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1